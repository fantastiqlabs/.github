name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  choose-runner:
    uses: fantastiqlabs/agentastiq/.github/workflows/select-runner.yml@1d642d525e01b29e751e9745e886fe1b3135a4ce
    secrets: inherit

  build:
    needs: choose-runner
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          set -euo pipefail
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; else npm install --ignore-scripts; fi
          fi
      - name: Run project checks
        run: |
          set -euo pipefail
          if [[ -d tests || -n "$(find . -maxdepth 2 -type f -name 'test_*.py' -print -quit)" ]]; then
            python -m unittest discover -v
          fi
          if [[ -f package.json ]]; then
            npm test --if-present
            npm run build --if-present
          fi
          if [[ -f Dockerfile ]]; then
            docker build --tag "local/${GITHUB_REPOSITORY##*/}:${GITHUB_SHA}" .
          fi
          python - <<'PYDOCS'
          from pathlib import Path
          docs = list(Path('.').rglob('*.md'))
          ignored = {'.git', 'node_modules', '.venv'}
          docs = [p for p in docs if not (set(p.parts) & ignored)]
          for path in docs:
              path.read_text(encoding='utf-8')
          empty = [str(path) for path in docs if not path.read_text(encoding='utf-8').strip()]
          if empty:
              print('::warning::Empty Markdown files: ' + ', '.join(empty))
          print(f'Checked {len(docs)} Markdown files.')
          PYDOCS
