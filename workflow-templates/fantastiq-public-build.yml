name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          set -euo pipefail
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; else npm install --ignore-scripts; fi
          fi
      - name: Run project checks
        run: |
          set -euo pipefail
          if [[ -d tests || -n "$(find . -maxdepth 2 -type f -name 'test_*.py' -print -quit)" ]]; then
            python -m unittest discover -v
          fi
          if [[ -f package.json ]]; then
            npm test --if-present
            npm run build --if-present
          fi
          if [[ -f Dockerfile ]]; then
            docker build --tag "local/${GITHUB_REPOSITORY##*/}:${GITHUB_SHA}" .
          fi
          python - <<'PYDOCS'
          from pathlib import Path
          docs = list(Path('.').rglob('*.md'))
          ignored = {'.git', 'node_modules', '.venv'}
          docs = [p for p in docs if not (set(p.parts) & ignored)]
          if any(not p.read_text(encoding='utf-8').strip() for p in docs):
              raise SystemExit('A Markdown file is empty.')
          print(f'Checked {len(docs)} Markdown files.')
          PYDOCS
